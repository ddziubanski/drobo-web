<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Drobo Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='%23182230'/%3E%3Cg fill='%233ddc84'%3E%3Crect x='7' y='8' width='14' height='3' rx='1'/%3E%3Crect x='7' y='14' width='14' height='3' rx='1'/%3E%3C/g%3E%3Crect x='7' y='20' width='14' height='3' rx='1' fill='%23f5c542'/%3E%3Cg fill='%233aa0ff'%3E%3Ccircle cx='24' cy='9.5' r='1.6'/%3E%3Ccircle cx='24' cy='15.5' r='1.6'/%3E%3Ccircle cx='24' cy='21.5' r='1.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="icon-btn" href="./" title="Back to the dashboard" aria-label="Back to the dashboard"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="title">
      <h1>Settings</h1>
      <span class="sub" id="saved-to">loading…</span>
    </div>
  </div>
  <div class="top-right">
    <span class="badge demo" id="mode-badge" hidden>DEMO</span>
    <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </div>
</header>

<div class="banner warn" id="banner" hidden></div>

<form id="form" class="settings" novalidate autocomplete="off"></form>

<div class="savebar" id="savebar" hidden>
  <span id="save-msg">Unsaved changes</span>
  <span class="savebar-btns">
    <button type="button" class="btn" id="revert">Discard</button>
    <button type="submit" class="btn primary" id="save" form="form">Save</button>
  </span>
</div>

<footer class="foot">
  <span>These are drobo-web's own settings. The Drobo's settings (name, lights, network) can't be changed yet.</span>
</footer>
<script src="settings.js"></script>
</body>
</html>
